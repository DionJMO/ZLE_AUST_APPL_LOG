<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- Nur der Titel VOR dem Start von UI5. Danach setzt Component.init( )
         ihn aus dem i18n-Bundle, damit es eine Quelle gibt. -->
    <title>HiLIS Monitoring</title>
    <style>
        html, body, body > div, #container, #container-uiarea {
            height: 100%;
        }
    </style>

    <script
        id="sap-ui-bootstrap"
        src="resources/sap-ui-cachebuster/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-resource-roots='{
            "zui5_zle_aust_mon": "./"
        }'
        data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
        data-sap-ui-compat-version="edge"
        data-sap-ui-async="true"
        data-sap-ui-frame-options="trusted"
        data-sap-ui-appCachebuster="./">
    </script>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content">
    <div
        data-sap-ui-component
        data-name="zui5_zle_aust_mon"
        data-id="container"
        data-settings='{"id" : "zui5_zle_aust_mon"}'
        data-handle-validation="true"
    ></div>
</body>
</html>
