infoTooltip=Hinweise zur Bedienung
infoTitle=Hinweise
infoRefreshTitle=Selbsttätige Aktualisierung
infoRefreshText=Steht der Schalter auf Live, lädt die Sicht alle 30 Sekunden vollständig neu. Bei hoher Last abschalten – die Auswahl bleibt für diesen Browser gemerkt. In einem Hintergrund-Tab pausiert der Takt ohnehin, und ein noch laufender Ladevorgang wird nie überholt.
infoManualTitle=Jetzt aktualisieren
infoManualText=Steht der Schalter auf Aus, erscheint daneben ein Knopf zum sofortigen Neuladen – bei laufendem Takt wird er nicht gebraucht und ist deshalb ausgeblendet. Ob der Takt läuft, sieht man am Zeitstempel „Stand“: er ändert sich alle 30 Sekunden, auch wenn die Liste gleich bleibt.

autoRefreshToOff=Selbsttätige Aktualisierung ausschalten
autoRefreshToOn=Selbsttätige Aktualisierung einschalten

infoTabsTitle=Die Reiter
infoTabsText=Wareneingang, Warenausgang und Materialstamm teilen die Meldungen nach Prozess. „Ohne Zuordnung“ sammelt, was das Backend nicht kennzeichnet – die Zahl schrumpft, sobald dort nachgezogen wird. „Alle Meldungen“ ist bewusst eine Obermenge: die Reiterzahlen addieren sich nicht darauf.
infoTypesTitle=Fehler, Abbrüche, Erfolge
infoTypesText=Fehler sind technisch – HTTP, Verbindung, Berechtigung – und Sache der IT. Abbrüche sind fachlich: eine Position wurde nicht übertragen, weil Stammdaten, Mengeneinheit oder Menge nicht passen. Erfolge sind übertragene Aufträge.
infoGroupTitle=Nach Vorgang
infoGroupText=Ein einziges Ereignis erzeugt oft drei Logzeilen – HTTP-Fehler, Meldung der Consumer-Schicht, fachliche Zusammenfassung. Der Schalter fasst sie zu einer Zeile zusammen. Die Spalte „Schritte“ zeigt, wie viele es waren, und öffnet sie einzeln.
infoOpenOnlyTitle=Nur offene
infoOpenOnlyText=Blendet Vorgänge aus, deren jüngste Meldung ein Erfolg ist – also die, die sich durch einen Wiederanstoß im Hintergrund bereits erledigt haben.
infoSearchTitle=Suche
infoSearchText=Sucht gleichzeitig in TPA-Nummer, Material, Meldungstext und Business-Key, und zwar auf Teiltreffer. Führende Nullen sind egal: „6024397“ findet auch „0006024397“. Die Suche grenzt innerhalb des Reiters ein, sie hebt ihn nicht auf.
infoDetailTitle=Details zu einer Nummer
infoDetailText=Ein Klick auf eine TPA- oder Materialnummer öffnet die SAP-Sicht dazu: Auftragskopf und Positionen aus LTAK/LTAP beziehungsweise den Materialstamm, dazu den Verlauf aller Meldungen zu diesem Schlüssel. Die Büroklammer in der Meldung zeigt den JSON-Payload, das Uhrsymbol alle Schritte desselben Vorgangs.
infoChartTitle=Verlauf
infoChartText=Zeitraum wahlweise 7, 14 oder 30 Tage. Steht dort „Datenmenge gekürzt“, wurde die Leseobergrenze erreicht und der Verlauf ist unvollständig – dann den Zeitraum verkleinern.
infoTpaTitle=Einlageraufträge
infoTpaText=Der Puffer der HiLIS-Aufträge, gefüllt vom Report ZLE_AUST_TPA_SYNC. Eine leere Liste ist meist kein Fehler, sondern heißt: der Report lief noch nicht.
infoWaCheckTitle=WA-Prüfung
infoWaCheckText=Sucht Transportaufträge, in denen AS-Einlagerung und AS-Auslagerung zusammentreffen – dort erreicht der Kommissionierauftrag HiLIS nie. Achtung: „Prüfung nicht durchgeführt“ ist keine Entwarnung. Dann konnte gar nicht gelesen werden, und die 0 sagt nichts aus.
infoReprocTitle=Arbeitsvorrat
infoReprocText=Vorgänge, die auf einen Wiederanstoß warten. Sichtbar ist nur Fehlerhaftes, Erledigtes verschwindet von selbst. „Erneut“ stößt den Vorgang erneut an – der Versuchszähler läuft mit, und rückgängig machen lässt sich das nicht.
infoShareTitle=Ansicht teilen
infoShareText=Reiter, Typfilter, Suchbegriff, Gruppierung und Zeitraum stehen in der Adresszeile. Wer den Link verschickt, zeigt dem Empfänger genau diese Sicht.

