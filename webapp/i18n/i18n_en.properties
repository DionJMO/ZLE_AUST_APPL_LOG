infoTooltip=How this page works
infoTitle=Notes
infoRefreshTitle=Automatic refresh
infoRefreshText=With the switch set to Live, the view reloads completely every 30 seconds. Switch it off if the load is a problem – the choice is remembered for this browser. The interval pauses in a background tab anyway, and a running load is never overtaken.
infoManualTitle=Refresh now
infoManualText=With the switch set to off, a button for reloading immediately appears next to it – while the interval runs it is not needed and is therefore hidden. To see whether the interval is running, watch the “As of” timestamp: it changes every 30 seconds even when the list does not.

autoRefreshToOff=Turn automatic refresh off
autoRefreshToOn=Turn automatic refresh on

infoTabsTitle=The tabs
infoTabsText=Goods receipt, goods issue and material master split the operations by process. “Unassigned” collects whatever the backend does not tag – that number shrinks as the backend is completed. “All operations” is deliberately a superset: the tab counts do not add up to it. The tab count counts messages, the table groups them into operations – the line above the table names both.
infoTypesTitle=Errors, aborts, successes
infoTypesText=Errors are technical – HTTP, connection, authorisation – and belong to IT. Aborts are functional: an item was not transferred because master data, unit of measure or quantity did not fit. Successes are transferred orders.
infoGroupTitle=By process step
infoGroupText=A single event often produces three log lines – HTTP error, consumer-layer message, functional summary. The switch combines them into one row. The “Steps” column shows how many there were and opens them individually.
infoOpenOnlyTitle=Open only
infoOpenOnlyText=Hides operations whose most recent message is a success – those that have already been put right by a retry in the background.
infoSearchTitle=Search
infoSearchText=Searches the TPA number, material, message text and business key at the same time, on partial matches. Leading zeros do not matter: “6024397” also finds “0006024397”. The search narrows within the tab, it does not override it.
infoDetailTitle=Details for a number
infoDetailText=Clicking a TPA or material number opens the SAP view for it: order header and items from LTAK/LTAP or the material master, plus the history of all messages for that key. The paper clip in a message shows the JSON payload; the "Steps" column opens all messages of the same operation, numbered and with the system side per step.
infoChartTitle=History
infoChartText=Period of 7, 14 or 30 days. If it says “data truncated”, the read limit was reached and the history is incomplete – reduce the period.
infoTpaTitle=Put-away orders
infoTpaText=The buffer of HiLIS orders, filled by report ZLE_AUST_TPA_SYNC. An empty list is usually not a fault but means the report has not run yet.
infoWaCheckTitle=Goods issue check
infoWaCheckText=Looks for transfer orders in which an AS put-away and an AS pick item meet – there the pick order never reaches HiLIS. Note: “check not performed” is not an all-clear. In that case nothing could be read, and the 0 says nothing.
infoReprocTitle=Work list
infoReprocText=Operations waiting to be retried. Only faulty ones are shown, completed ones disappear by themselves. “Retry” triggers the operation again – the attempt counter goes up, and it cannot be undone.
infoShareTitle=Share this view
infoShareText=Tab, type filter, search term, grouping and period are held in the address bar. Sending the link shows the recipient exactly this view.

